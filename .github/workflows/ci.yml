name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile ferret_mail_service.py test_ferret_mail_service.py
      - name: Test
        run: python -m unittest -v test_ferret_mail_service.py
      - name: Reject private deployment residue
        shell: pwsh
        run: |
          $patterns = 'C:\\Users\\|(?:10\.(?:\d{1,3}\.){2}\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.(?:\d{1,3}\.)\d{1,3}|192\.168\.(?:\d{1,3}\.)\d{1,3})'
          $hits = rg -n --hidden --glob '!.git/**' --pcre2 $patterns .
          if ($LASTEXITCODE -eq 0) { $hits; throw 'Private deployment residue found.' }
          if ($LASTEXITCODE -ne 1) { throw 'Privacy scan failed.' }
